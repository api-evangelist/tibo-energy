name: Tibo Energy
description: >-
  Tibo Energy is an Eindhoven-based energy software company building an AI-driven
  Energy Management System (EMS) for commercial and industrial customers. Its SaaS
  platform simulates, monitors, and autonomously controls on-site energy hubs and
  smart grids, coordinating distributed assets such as heat pumps, EV charging
  stations, and battery storage to cut energy costs and emissions and to unlock
  additional capacity from existing infrastructure without waiting for grid
  upgrades. Tibo connects hardware through standard protocols such as MODBUS and
  OCPP via the Tibo Gateway and exchanges data with BMS, SCADA, and ERP systems
  through open APIs. Since launching in late 2023 it has deployed its EMS across
  more than 30 industrial sites and is backed by KOMPAS VC, Hitachi Ventures, SET
  Ventures, WEPA Ventures, and Speedinvest.
